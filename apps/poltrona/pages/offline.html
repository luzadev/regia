<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Regia · Poltrona</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; overflow: hidden; cursor: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 4vh; }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--muted); animation: pulse 1.6s ease-in-out infinite; }
  h1 { font-size: clamp(34px, 6vw, 80px); margin: 0; }
  p { font-size: clamp(18px, 2.6vw, 34px); color: var(--muted); margin: 0; max-width: 28em; }
  .station { font-size: 18px; color: var(--line); position: fixed; bottom: 16px; }
  @keyframes pulse { 50% { opacity: .25; } }
</style>
</head>
<body>
  <div class="dot"></div>
  <h1>SISTEMA NON DISPONIBILE</h1>
  <p id="msg"></p>
  <div class="station" id="station"></div>
<script src="offline.js"></script>
</body>
</html>
